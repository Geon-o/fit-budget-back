spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: fit-budget
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8089

app:
  jwt:
    secret: ${JWT_SECRET}
  google:
    # id_token의 aud로 허용할 client ID. 플랫폼(Android/iOS/Web)별로 다르면 콤마로 나열
    client-ids: ${GOOGLE_CLIENT_ID}
  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}

ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
  sidecar-secret: ${AI_SIDECAR_SECRET}

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace
